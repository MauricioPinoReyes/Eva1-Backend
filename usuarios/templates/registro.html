{% extends "base.html" %}
{% block content %}
<h2 style="text-align: center;">Registro de Usuario</h2>
{% if error %}<p class="error">{{ error }}</p>{% endif %}

<form method="POST" id="formRegistro">
    {% csrf_token %}
    <label>Nombre de usuario:</label>
    <input type="text" name="nombre" required>
    
    <label>Correo electrónico:</label>
    <input type="email" name="correo" required>
    
    <label>Contraseña:</label>
    <input type="password" id="pass1" name="pass1" required>
    <span id="requisitos" class="requisitos">Mínimo 8 caracteres, 1 mayúscula y 1 número.</span>
    
    <label>Confirmar contraseña:</label>
    <input type="password" id="pass2" name="pass2" required>
    <span id="coincidencia" class="error"></span>

    <button type="submit" class="btn-submit">Registrarse</button>
</form>
<p style="text-align: center; margin-top: 15px;">¿Ya tienes cuenta? <a href="/login/">Inicia sesión</a></p>
