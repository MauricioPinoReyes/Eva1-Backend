<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Registrar Producto</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container text-center">
        <h1>Formulario de Registro</h1>
        <h4><a href="{% url 'productos:index' %}">Volver al Index</a></h4>

        {% if msjErr %}
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
            <h5>{{ msjErr }}</h5>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endif %}

        {% if msjOk %}
        <div class="alert alert-success alert-dismissible fade show" role="alert">
            <h5>{{ msjOk }}</h5>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endif %}

        <form action="{% url 'productos:insertar' %}" method="post" style="margin-top: 20px;">
            {% csrf_token %}

            <input type="text" name="txtnom" placeholder="Nombre de Producto" required class="form-control form-control-lg">
            <br>

            <select name="cbox" required class="form-select form-select-lg">
                <option value="">Seleccione Marca</option>
                <option value="Samsung">Samsung</option>
                <option value="Apple">Apple</option>
                <option value="Lenovo">Lenovo</option>
                <option value="Xiaomi">Xiaomi</option>
            </select>
            <br>

            <input type="number" name="txtpre" min="1" max="9999999" placeholder="Precio de Producto" required class="form-control form-control-lg">
            <br>

            <input type="submit" value="Guardar Datos" class="btn btn-primary btn-lg" style="width:100%">
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
</body>
</html>
