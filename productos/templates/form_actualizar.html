<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Actualizar Producto</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container text-center">
        <h1>Formulario Actualizar</h1>
        <h4><a href="{% url 'productos:index' %}">Volver al Index</a></h4>

        <form action="" method="post" style="margin-top: 20px;">
            {% csrf_token %}

            <input type="text" name="txtnom" value="{{ producto.nombre }}" placeholder="Nombre de Producto" required class="form-control form-control-lg">
            <br>

            <select name="cbox" required class="form-select form-select-lg">
                <option value="">Seleccione Marca</option>
                <option value="Samsung" {% if producto.marca == 'Samsung' %}selected{% endif %}>Samsung</option>
                <option value="Apple" {% if producto.marca == 'Apple' %}selected{% endif %}>Apple</option>
                <option value="Lenovo" {% if producto.marca == 'Lenovo' %}selected{% endif %}>Lenovo</option>
                <option value="Xiaomi" {% if producto.marca == 'Xiaomi' %}selected{% endif %}>Xiaomi</option>
            </select>
            <br>

            <input type="number" name="txtpre" value="{{ producto.precio }}" min="1" max="9999999" placeholder="Precio de Producto" required class="form-control form-control-lg">
            <br>

            <input type="submit" value="Guardar Datos" class="btn btn-primary btn-lg" style="width:100%">
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
</body>
</html>
