<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Listado</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        function confirmar() {
            return confirm('¿Está seguro de querer eliminar el registro?');
        }
    </script>
</head>
<body>
    <div class="container text-center">
        <h1>Listado de Productos</h1>
        <h4><a href="{% url 'productos:index' %}">Volver al Index</a></h4>

        <table id="tbl" class="table table-hover" style="margin-top: 20px;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>NOMBRE</th>
                    <th>MARCA</th>
                    <th>PRECIO</th>
                    <th>EDITAR</th>
                    <th>ELIMINAR</th>
                </tr>
            </thead>
            <tbody>
                {% for producto in productos %}
                <tr class="dato">
                    <td>{{ producto.id }}</td>
                    <td>{{ producto.nombre }}</td>
                    <td>{{ producto.marca }}</td>
                    <td>{{ producto.precio }}</td>
                    <td>
                        <a href="{% url 'productos:form_actualizar' producto.id %}" class="btn btn-warning btn-sm">Editar</a>
                    </td>
                    <td>
                        <a href="{% url 'productos:eliminar' producto.id %}" class="btn btn-danger btn-sm" onclick="return confirmar()">Eliminar</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="6">No hay productos registrados.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
</body>
</html>
